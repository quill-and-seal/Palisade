<!doctype html><meta charset="utf-8"><body>
<script>
  const hooks = {}; const settings = { brushDetail: 2, brushRadius: 48, brushWallType: "normal" };
  window.Hooks = { on: (n, f) => (hooks[n] ??= []).push(f), call: (n) => (hooks[n] ?? []).forEach((f) => f()) };
  window.game = { user: { isGM: true }, i18n: { localize: (k) => k, format: (k) => k }, settings: { get: (m, k) => settings[k], set: async () => {} } };
  window.ui = { controls: { tool: { name: "palisade-brush" } }, notifications: { warn() {}, error() {} } };
  window.canvas = { ready: true, stage: { scale: { x: 1 } }, app: { view: document.createElement("canvas") } };
</script>
<script type="module">
  import { registerBrushTool } from "/scripts/brush-tool.js";
  registerBrushTool();
  Hooks.call("renderSceneControls");
  const d = document.getElementById("palisade-dial");
  document.title = JSON.stringify({ toolActiveNoPreview: d ? d.style.display : "absent" });
</script>
